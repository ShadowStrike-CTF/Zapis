<style>
  :root {
    --brick: #a93226;
    --brick-soft: rgba(169, 50, 38, 0.15);
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  @page {
    size: A4;
    margin: 18mm 16mm;
    background: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DejaVu Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.55;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  header {
    border-bottom: 3px solid var(--brick);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .eyebrow {
    color: var(--brick);
    font-size: 9pt;
    font-weight: bold;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  h1 {
    font-size: 22pt;
    line-height: 1.2;
    margin: 0;
    word-wrap: break-word;
  }
  .ctf {
    color: var(--muted);
    margin: 6px 0 0;
  }
  table.meta {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  table.meta th, table.meta td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.meta tr:last-child th, table.meta tr:last-child td { border-bottom: none; }
  table.meta th {
    width: 28%;
    color: var(--muted);
    font-size: 9pt;
    font-weight: normal;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge {
    display: inline-block;
    padding: 1px 10px;
    border: 1px solid var(--brick);
    background: var(--brick-soft);
    color: var(--text);
    border-radius: 10px;
    font-size: 9.5pt;
  }
  .pip {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 3px;
    border: 1px solid var(--brick);
    border-radius: 50%;
  }
  .pip.on { background: var(--brick); }
  .diff-label { margin-left: 6px; color: var(--muted); }
  section { margin-bottom: 22px; page-break-inside: auto; }
  h2 {
    font-size: 12pt;
    color: var(--brick);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    margin: 0 0 10px;
    page-break-after: avoid;
  }
  ul.tools { margin: 0; padding-left: 20px; }
  ul.tools li { margin: 2px 0; }
  .prose { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
  .empty { color: var(--muted); font-style: italic; margin: 0; }
  .flag {
    font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace;
    font-size: 11pt;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brick);
    padding: 10px 14px;
    margin: 0;
    word-break: break-all;
    page-break-inside: avoid;
  }
  footer {
    margin-top: 32px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 8.5pt;
    text-align: center;
  }
{% if has_code %}  pre {
    font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace;
    font-size: 9.5pt;
    line-height: 1.45;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brick);
    padding: 10px 14px;
    margin: 10px 0;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-wrap: anywhere;
    page-break-inside: auto;
  }
  pre code { font-family: inherit; }
{% endif %}</style>
