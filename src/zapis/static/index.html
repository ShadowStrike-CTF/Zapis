<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapis — CTF Writeup</title>
<style>
  :root {
    --brick: #a93226;
    --brick-soft: rgba(169, 50, 38, 0.15);
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  header {
    border-bottom: 3px solid var(--brick);
    padding: 18px 24px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 24px; color: var(--brick); letter-spacing: 0.04em; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  label .req { color: var(--brick); }
  input, select, textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brick); box-shadow: 0 0 0 2px var(--brick-soft); }
  textarea { resize: vertical; min-height: 70px; }
  textarea#approach { min-height: 180px; }
  #flag { font-family: Consolas, "DejaVu Sans Mono", monospace; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    background: var(--brick);
    color: #fff;
    border: 1px solid var(--brick);
    border-radius: 6px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: #e6674f; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 24px; }
  @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>ZAPIS</h1>
  <span>CTF writeup templating and export · by ShadowStrike</span>
</header>
<main>
  <form id="writeup" novalidate>
    <div>
      <label for="challenge_name">Challenge name <span class="req">*</span></label>
      <input id="challenge_name" name="challenge_name" required>
    </div>
    <div>
      <label for="ctf_name">CTF name <span class="req">*</span></label>
      <input id="ctf_name" name="ctf_name" required>
    </div>
    <div>
      <label for="category">Category <span class="req">*</span></label>
      <select id="category" name="category" required></select>
    </div>
    <div>
      <label for="difficulty">Difficulty <span class="req">*</span></label>
      <select id="difficulty" name="difficulty">
        <option value="1">1 — Easy</option>
        <option value="2">2 — Medium</option>
        <option value="3">3 — Hard</option>
      </select>
    </div>
    <div class="full">
      <label for="tools_used">Tools used</label>
      <textarea id="tools_used" name="tools_used"></textarea>
      <div class="hint">One per line, or comma-separated.</div>
    </div>
    <div class="full">
      <label for="approach">Approach <span class="req">*</span></label>
      <textarea id="approach" name="approach" required></textarea>
    </div>
    <div class="full">
      <label for="flag">Flag <span class="req">*</span></label>
      <input id="flag" name="flag" required autocomplete="off" spellcheck="false">
    </div>
    <div class="full">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes"></textarea>
    </div>
    <div>
      <label for="author">Author</label>
      <input id="author" name="author" value="ShadowStrike">
    </div>
    <div>
      <label for="date">Date</label>
      <input id="date" name="date" type="date">
    </div>
    <div class="full actions">
      <button type="button" data-fmt="md">Download MD</button>
      <button type="button" data-fmt="html">Download HTML</button>
      <button type="button" data-fmt="pdf">Download PDF</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </form>
</main>
<footer>© 2026 ShadowStrike. All rights reserved. · MIT</footer>
<script>
(function () {
  "use strict";
  var form = document.getElementById("writeup");
  var statusEl = document.getElementById("status");
  var buttons = form.querySelectorAll("button[data-fmt]");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function value(id) { return document.getElementById(id).value; }

  var today = new Date();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  document.getElementById("date").value =
    today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());

  fetch("/api/categories")
    .then(function (r) { return r.json(); })
    .then(function (cats) {
      var sel = document.getElementById("category");
      cats.forEach(function (c) {
        var opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    })
    .catch(function () { setStatus("Could not load categories.", true); });

  function payload() {
    var tools = value("tools_used").split(/[\n,]/)
      .map(function (t) { return t.trim(); })
      .filter(function (t) { return t.length > 0; });
    return {
      challenge_name: value("challenge_name").trim(),
      ctf_name: value("ctf_name").trim(),
      category: value("category"),
      difficulty: parseInt(value("difficulty"), 10),
      tools_used: tools,
      approach: value("approach"),
      flag: value("flag").trim(),
      notes: value("notes"),
      author: value("author").trim() || "ShadowStrike",
      date: value("date")
    };
  }

  function missing(data) {
    var labels = { challenge_name: "Challenge name", ctf_name: "CTF name",
                   approach: "Approach", flag: "Flag" };
    return Object.keys(labels).filter(function (k) { return !String(data[k]).trim(); })
      .map(function (k) { return labels[k]; });
  }

  function filenameFrom(resp, fmt) {
    var cd = resp.headers.get("Content-Disposition") || "";
    var m = /filename="([^"]+)"/.exec(cd);
    return m ? m[1] : "writeup." + fmt;
  }

  function errorText(resp) {
    return resp.json()
      .then(function (j) {
        return typeof j.detail === "string" ? j.detail : "Invalid input (" + resp.status + ")";
      })
      .catch(function () { return "Export failed (" + resp.status + ")"; });
  }

  function exportAs(fmt) {
    var data = payload();
    var gaps = missing(data);
    if (gaps.length) {
      setStatus("Required: " + gaps.join(", "), true);
      return;
    }
    buttons.forEach(function (b) { b.disabled = true; });
    setStatus("Exporting " + fmt.toUpperCase() + "…", false);
    fetch("/api/export/" + fmt, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    })
      .then(function (resp) {
        if (!resp.ok) {
          return errorText(resp).then(function (msg) { throw new Error(msg); });
        }
        var name = filenameFrom(resp, fmt);
        return resp.blob().then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          setStatus("Saved " + name, false);
        });
      })
      .catch(function (err) { setStatus(err.message || "Export failed.", true); })
      .then(function () { buttons.forEach(function (b) { b.disabled = false; }); });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { exportAs(b.getAttribute("data-fmt")); });
  });
})();
</script>
</body>
</html>
