<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapis — CTF Writeup</title>
<style>
  :root {
    --brick: #a93226;
    --brick-soft: rgba(169, 50, 38, 0.15);
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  header {
    border-bottom: 3px solid var(--brick);
    padding: 18px 24px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 24px; color: var(--brick); letter-spacing: 0.04em; }
  header span { color: var(--muted); font-size: 13px; }
  header { flex-wrap: wrap; }
  header .import { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
  header .import select { width: auto; max-width: 260px; }
  header .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header button { padding: 7px 12px; font-size: 13px; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost:hover { border-color: var(--brick); }
  #import_status { font-size: 13px; color: var(--muted); flex-basis: 100%; text-align: right; min-height: 1.2em; }
  #import_status.error { color: #e6674f; }
  #remove_confirm { font-size: 13px; color: var(--text); background: var(--brick-soft); border: 1px solid var(--brick); border-radius: 6px; padding: 4px 8px; }
  [hidden] { display: none !important; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  label .req { color: var(--brick); }
  input, select, textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brick); box-shadow: 0 0 0 2px var(--brick-soft); }
  textarea { resize: vertical; min-height: 70px; }
  textarea#approach { min-height: 180px; }
  #flag { font-family: Consolas, "DejaVu Sans Mono", monospace; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    background: var(--brick);
    color: #fff;
    border: 1px solid var(--brick);
    border-radius: 6px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: #e6674f; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 24px; }
  @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>ZAPIS</h1>
  <span>CTF writeup templating and export · by ShadowStrike</span>
  <div class="import">
    <div class="group">
      <select id="import_pick" aria-label="Challenge" hidden></select>
      <button type="button" class="ghost" id="new_btn">New challenge</button>
      <button type="button" class="ghost" id="remove_btn">Remove challenge</button>
      <span id="remove_confirm" hidden>
        <span id="remove_text"></span>
        <button type="button" id="remove_yes">Remove</button>
        <button type="button" class="ghost" id="remove_no">Cancel</button>
      </span>
    </div>
    <div class="group">
      <button type="button" id="import_btn">Import from Sarissa</button>
      <input type="file" id="import_file" accept=".json" hidden>
      <button type="button" class="ghost" id="draft_open_btn">Open draft</button>
      <input type="file" id="draft_file" accept=".json" hidden>
      <button type="button" class="ghost" id="draft_save_btn">Save draft</button>
    </div>
    <div class="group" id="bundle_controls" hidden>
      <select id="bundle_fmt" aria-label="Export all format">
        <option value="md">Markdown</option>
        <option value="html">HTML</option>
        <option value="pdf">PDF</option>
        <option value="zip">Zip</option>
      </select>
      <select id="bundle_inner" aria-label="Files inside the zip" hidden>
        <option value="md">.md files</option>
        <option value="html">.html files</option>
        <option value="pdf">.pdf files</option>
      </select>
      <button type="button" id="bundle_btn">Export all</button>
    </div>
    <span id="import_status" role="status" aria-live="polite"></span>
  </div>
</header>
<main>
  <form id="writeup" novalidate>
    <div>
      <label for="challenge_name">Challenge name <span class="req">*</span></label>
      <input id="challenge_name" name="challenge_name" required>
    </div>
    <div>
      <label for="ctf_name">CTF name <span class="req">*</span></label>
      <input id="ctf_name" name="ctf_name" required>
    </div>
    <div>
      <label for="category">Category <span class="req">*</span></label>
      <select id="category" name="category" required></select>
    </div>
    <div>
      <label for="difficulty">Difficulty <span class="req">*</span></label>
      <select id="difficulty" name="difficulty">
        <option value="1">1 — Easy</option>
        <option value="2">2 — Medium</option>
        <option value="3">3 — Hard</option>
      </select>
    </div>
    <div class="full">
      <label for="tools_used">Tools used</label>
      <textarea id="tools_used" name="tools_used"></textarea>
      <div class="hint">One per line, or comma-separated.</div>
    </div>
    <div class="full">
      <label for="approach">Approach <span class="req">*</span></label>
      <textarea id="approach" name="approach" required></textarea>
    </div>
    <div class="full">
      <label for="flag">Flag <span class="req">*</span></label>
      <input id="flag" name="flag" required autocomplete="off" spellcheck="false">
    </div>
    <div class="full">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes"></textarea>
    </div>
    <div>
      <label for="author">Author</label>
      <input id="author" name="author" value="ShadowStrike">
    </div>
    <div>
      <label for="date">Date</label>
      <input id="date" name="date" type="date">
    </div>
    <div>
      <label for="time_spent_minutes">Time spent (min)</label>
      <input id="time_spent_minutes" name="time_spent_minutes" type="number" min="0" step="1" inputmode="numeric">
      <div class="hint">Optional. Empty or 0 is left out of the writeup.</div>
    </div>
    <div class="full actions">
      <button type="button" data-fmt="md">Download MD</button>
      <button type="button" data-fmt="html">Download HTML</button>
      <button type="button" data-fmt="pdf">Download PDF</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </form>
</main>
<footer>© 2026 ShadowStrike. All rights reserved.</footer>
<script>
(function () {
  "use strict";
  // All user data goes through textContent / value only. No browser dialogs.
  var form = document.getElementById("writeup");
  var statusEl = document.getElementById("status");
  var buttons = form.querySelectorAll("button[data-fmt]");
  var FIELDS = ["challenge_name", "ctf_name", "category", "difficulty", "tools_used", "approach",
                "flag", "notes", "author", "date", "time_spent_minutes"];

  function el(id) { return document.getElementById(id); }
  function value(id) { return el(id).value; }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  var importStatus = el("import_status");
  function setImportStatus(text, isError) {
    importStatus.textContent = text;
    importStatus.className = isError ? "error" : "";
  }

  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  el("date").value = todayISO();

  fetch("/api/categories")
    .then(function (r) { return r.json(); })
    .then(function (cats) {
      var sel = el("category");
      cats.forEach(function (c) {
        var opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    })
    .catch(function () { setStatus("Could not load categories.", true); });

  function parseTools(text) {
    return text.split(/[\n,]/)
      .map(function (t) { return t.trim(); })
      .filter(function (t) { return t.length > 0; });
  }

  function parseMinutes(text) {
    if (!String(text).trim()) { return 0; }
    var n = Number(text);
    return Number.isInteger(n) ? n : NaN;
  }

  // --- Working set ---------------------------------------------------------
  // In-memory list of entries (the server stores nothing — INV-P2-1). The form always shows
  // workingSet[activeIndex]; commit() writes the form back before anything reads the set.
  var workingSet = [null];  // null = "whatever the form shows" until the first commit
  var activeIndex = 0;

  function readForm() {
    var minutes = parseMinutes(value("time_spent_minutes"));
    return {
      challenge_name: value("challenge_name"),
      ctf_name: value("ctf_name"),
      category: value("category"),
      difficulty: parseInt(value("difficulty"), 10) || 0,
      tools_used: parseTools(value("tools_used")),
      approach: value("approach"),
      flag: value("flag"),
      notes: value("notes"),
      author: value("author"),
      date: value("date"),
      time_spent_minutes: isNaN(minutes) ? 0 : minutes
    };
  }

  function fillForm(entry) {
    el("challenge_name").value = entry.challenge_name || "";
    el("ctf_name").value = entry.ctf_name || "";
    // Blank category/difficulty (import, new entry) leaves both selects unchosen.
    el("category").value = entry.category || "";
    el("difficulty").value = entry.difficulty ? String(entry.difficulty) : "";
    el("tools_used").value = (entry.tools_used || []).join("\n");
    el("approach").value = entry.approach || "";
    el("flag").value = entry.flag || "";
    el("notes").value = entry.notes || "";
    el("author").value = entry.author || "";
    el("date").value = entry.date || "";
    el("time_spent_minutes").value = entry.time_spent_minutes ? String(entry.time_spent_minutes) : "";
    setStatus("", false);
  }

  function commit() { workingSet[activeIndex] = readForm(); }

  function blankEntry() {
    var cur = workingSet[activeIndex] || readForm();
    return {
      challenge_name: "", ctf_name: cur.ctf_name, category: "", difficulty: 0, tools_used: [],
      approach: "", flag: "", notes: "", author: cur.author || "ShadowStrike",
      date: cur.date || todayISO(), time_spent_minutes: 0
    };
  }

  function isEmpty(entry) {
    return !entry || !(entry.challenge_name.trim() || entry.approach.trim() || entry.flag.trim() ||
                       entry.notes.trim() || entry.tools_used.length);
  }

  var picker = el("import_pick");
  function label(entry, i) {
    var name = entry && entry.challenge_name.trim();
    return (i + 1) + ". " + (name || "(unnamed)");
  }

  function refresh() {
    while (picker.firstChild) { picker.removeChild(picker.firstChild); }
    workingSet.forEach(function (e, i) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = label(e, i);
      picker.appendChild(opt);
    });
    picker.value = String(activeIndex);
    picker.hidden = workingSet.length < 2;
    el("bundle_controls").hidden = workingSet.length < 2;
    hideRemoveConfirm();
  }

  // Switching writes the current form back first — edits are never thrown away.
  function switchTo(i) {
    commit();
    activeIndex = i;
    fillForm(workingSet[i]);
    refresh();
  }

  function replaceSet(entries, index) {
    workingSet = entries.length ? entries : [blankEntry()];
    activeIndex = index >= 0 && index < workingSet.length ? index : 0;
    fillForm(workingSet[activeIndex]);
    refresh();
  }

  picker.addEventListener("change", function () { switchTo(parseInt(picker.value, 10)); });

  el("challenge_name").addEventListener("input", function () {
    var opt = picker.options[activeIndex];
    if (opt) { opt.textContent = label({ challenge_name: value("challenge_name") }, activeIndex); }
  });

  el("new_btn").addEventListener("click", function () {
    commit();
    workingSet.push(blankEntry());
    activeIndex = workingSet.length - 1;
    fillForm(workingSet[activeIndex]);
    refresh();
    setImportStatus("Added challenge " + workingSet.length + ".", false);
    el("challenge_name").focus();
  });

  // Remove asks inline — no browser dialog.
  var removeConfirm = el("remove_confirm");
  function hideRemoveConfirm() {
    removeConfirm.hidden = true;
    el("remove_btn").hidden = false;
  }
  el("remove_btn").addEventListener("click", function () {
    var name = value("challenge_name").trim();
    el("remove_text").textContent = "Remove " + (name ? "“" + name + "”" : "this challenge") + "?";
    el("remove_btn").hidden = true;
    removeConfirm.hidden = false;
    el("remove_no").focus();
  });
  el("remove_no").addEventListener("click", hideRemoveConfirm);
  el("remove_yes").addEventListener("click", function () {
    commit();
    var fresh = blankEntry();
    workingSet.splice(activeIndex, 1);
    if (!workingSet.length) { workingSet.push(fresh); }
    activeIndex = Math.min(activeIndex, workingSet.length - 1);
    fillForm(workingSet[activeIndex]);
    refresh();
    setImportStatus("Challenge removed.", false);
  });

  // --- Export payloads ---------------------------------------------------------
  function toPayload(entry) {
    return {
      challenge_name: entry.challenge_name.trim(),
      ctf_name: entry.ctf_name.trim(),
      category: entry.category,
      difficulty: entry.difficulty,
      tools_used: entry.tools_used,
      approach: entry.approach,
      flag: entry.flag.trim(),
      notes: entry.notes,
      author: entry.author.trim() || "ShadowStrike",
      date: entry.date,
      time_spent_minutes: entry.time_spent_minutes
    };
  }

  function payload() {
    var data = toPayload(readForm());
    var minutes = parseMinutes(value("time_spent_minutes"));
    data.time_spent_minutes = minutes;  // NaN / negative → server 422 with a clear message
    if (!data.difficulty) { data.difficulty = NaN; }
    return data;
  }

  function missing(data) {
    var labels = { challenge_name: "Challenge name", ctf_name: "CTF name",
                   category: "Category", difficulty: "Difficulty",
                   approach: "Approach", flag: "Flag" };
    return Object.keys(labels).filter(function (k) {
      var v = data[k];
      return typeof v === "number" ? isNaN(v) : !String(v).trim();
    }).map(function (k) { return labels[k]; });
  }

  function filenameFrom(resp, fallback) {
    var cd = resp.headers.get("Content-Disposition") || "";
    var m = /filename="([^"]+)"/.exec(cd);
    return m ? m[1] : fallback;
  }

  function errorText(resp) {
    return resp.json()
      .then(function (j) {
        return typeof j.detail === "string" ? j.detail : "Invalid input (" + resp.status + ")";
      })
      .catch(function () { return "Request failed (" + resp.status + ")"; });
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: typeof body === "string" ? body : JSON.stringify(body)
    }).then(function (resp) {
      if (!resp.ok) {
        return errorText(resp).then(function (msg) { throw new Error(msg); });
      }
      return resp;
    });
  }

  // Saves a response as a file download; resolves to the filename.
  function download(resp, fallback) {
    var name = filenameFrom(resp, fallback);
    return resp.blob().then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return name;
    });
  }

  function exportAs(fmt) {
    var data = payload();
    var gaps = missing(data);
    if (gaps.length) {
      setStatus("Required: " + gaps.join(", "), true);
      return;
    }
    if (isNaN(data.time_spent_minutes) || data.time_spent_minutes < 0) {
      setStatus("Time spent must be a whole number of minutes, 0 or more.", true);
      return;
    }
    buttons.forEach(function (b) { b.disabled = true; });
    setStatus("Exporting " + fmt.toUpperCase() + "…", false);
    postJSON("/api/export/" + fmt, data)
      .then(function (resp) { return download(resp, "writeup." + fmt); })
      .then(function (name) { setStatus("Saved " + name, false); })
      .catch(function (err) { setStatus(err.message || "Export failed.", true); })
      .then(function () { buttons.forEach(function (b) { b.disabled = false; }); });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { exportAs(b.getAttribute("data-fmt")); });
  });

  // --- Export all (bundle) ---------------------------------------------------------
  var bundleFmt = el("bundle_fmt");
  var bundleInner = el("bundle_inner");
  var bundleBtn = el("bundle_btn");
  bundleFmt.addEventListener("change", function () { bundleInner.hidden = bundleFmt.value !== "zip"; });

  bundleBtn.addEventListener("click", function () {
    commit();
    var fmt = bundleFmt.value;
    bundleBtn.disabled = true;
    setImportStatus("Exporting " + workingSet.length + " writeups…", false);
    // The server validates every entry and names each one that fails (422).
    postJSON("/api/export/bundle/" + fmt, { writeups: workingSet.map(toPayload), inner: bundleInner.value })
      .then(function (resp) { return download(resp, "writeups." + fmt); })
      .then(function (name) { setImportStatus("Saved " + name, false); })
      .catch(function (err) { setImportStatus("Export all failed: " + (err.message || "error"), true); })
      .then(function () { bundleBtn.disabled = false; });
  });

  // --- Drafts — user-owned files, the server keeps nothing -------------------------
  var draftSaveBtn = el("draft_save_btn");
  draftSaveBtn.addEventListener("click", function () {
    commit();
    draftSaveBtn.disabled = true;
    postJSON("/api/draft/save", { writeups: workingSet, active_index: activeIndex })
      .then(function (resp) { return download(resp, "draft.zapis.json"); })
      .then(function (name) { setImportStatus("Saved draft " + name, false); })
      .catch(function (err) { setImportStatus("Save draft failed: " + (err.message || "error"), true); })
      .then(function () { draftSaveBtn.disabled = false; });
  });

  // Reads a picked file and POSTs its raw text — the server is the single validator.
  function pickFile(input, btn, url, verb, onData) {
    btn.addEventListener("click", function () { input.click(); });
    input.addEventListener("change", function () {
      var file = input.files[0];
      input.value = "";
      if (!file) { return; }
      btn.disabled = true;
      setImportStatus(verb + "…", false);
      file.text()
        .then(function (text) { return postJSON(url, text); })
        .then(function (resp) { return resp.json(); })
        .then(function (data) { onData(data, file.name); })
        .catch(function (err) { setImportStatus(verb + " failed: " + (err.message || "error"), true); })
        .then(function () { btn.disabled = false; });
    });
  }

  pickFile(el("draft_file"), el("draft_open_btn"), "/api/draft/load", "Opening draft",
    function (data, fileName) {
      replaceSet(data.writeups, data.active_index);
      setImportStatus("Opened " + data.writeups.length + " writeup" +
                      (data.writeups.length === 1 ? "" : "s") + " from " + fileName, false);
    });

  // Sarissa import — file-based only; the server validates and maps (core/import_sarissa.py).
  // Additive: imported challenges join the working set (replacing it only if it is still blank).
  pickFile(el("import_file"), el("import_btn"), "/api/import/sarissa", "Importing",
    function (entries, fileName) {
      commit();
      var keep = workingSet.length === 1 && isEmpty(workingSet[0]) ? [] : workingSet;
      var base = workingSet[activeIndex];
      var added = entries.map(function (e) {
        var entry = { notes: "", author: base.author || "ShadowStrike", date: base.date || todayISO() };
        FIELDS.forEach(function (f) { if (f in e) { entry[f] = e[f]; } });
        return entry;
      });
      replaceSet(keep.concat(added), keep.length);
      setImportStatus("Imported " + entries.length + " challenge" +
                      (entries.length === 1 ? "" : "s") + " from " + fileName, false);
    });

  refresh();
})();
</script>
</body>
</html>
